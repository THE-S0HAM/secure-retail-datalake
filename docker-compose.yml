services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secure_retail_lakehouse}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  retail_pipeline:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-secure_retail_lakehouse}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      HASH_SALT: ${HASH_SALT}
      CUSTOMER_COUNT: ${CUSTOMER_COUNT:-1000}
      TRANSACTION_COUNT: ${TRANSACTION_COUNT:-5000}
      PRODUCT_COUNT: ${PRODUCT_COUNT:-100}
      DB_REQUIRED: "true"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./backups:/app/backups
    restart: "no"
volumes:
  postgres_data:
