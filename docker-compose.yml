services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  retail_pipeline:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      HASH_SALT: ${HASH_SALT}
      CUSTOMER_COUNT: ${CUSTOMER_COUNT:-10000}
      TRANSACTION_COUNT: ${TRANSACTION_COUNT:-50000}
      PRODUCT_COUNT: ${PRODUCT_COUNT:-1000}
      DB_REQUIRED: ${DB_REQUIRED:-true}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./backups:/app/backups
    restart: "no"

volumes:
  postgres_data:
